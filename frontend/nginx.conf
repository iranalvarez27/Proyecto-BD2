server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/media/upload recibe imágenes y audios en base64 dentro del JSON
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:8000;    # sin barra final: conserva el prefijo /api
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;           # consultas, CREATE INDEX o reorganizaciones largas
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
