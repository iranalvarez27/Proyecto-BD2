<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" role="img" aria-label="Flujo de la canción cantada: en la preparación, Demucs aísla la voz de cada canción y se guardan su letra con Whisper y su melodía; en cada consulta, Whisper transcribe la voz, BM25 busca la letra, y solo si falla se compara la melodía con DTW.">
<title>Canción cantada: reconocerla por su letra y, de respaldo, por su melodía</title>
<desc>Flujo de la canción cantada: en la preparación, Demucs aísla la voz de cada canción y se guardan su letra con Whisper y su melodía; en cada consulta, Whisper transcribe la voz, BM25 busca la letra, y solo si falla se compara la melodía con DTW.</desc>
<style>
  :root { color-scheme: light dark; }
  .fondo { fill: #fcfcfb; stroke: #e4e2dc; }
  .titulo { font: 700 17px system-ui, 'Segoe UI', sans-serif; fill: #0b0b0b; }
  .sub { font: 400 12px system-ui, 'Segoe UI', sans-serif; fill: #52514e; }
  .caja { fill: #ffffff; stroke: #cfccc4; stroke-width: 1.5; }
  .caja-t { font: 600 13px system-ui, 'Segoe UI', sans-serif; fill: #0b0b0b; }
  .caja-s { font: 400 11px system-ui, 'Segoe UI', sans-serif; fill: #52514e; }
  .num { font: 700 11px system-ui, sans-serif; fill: #ffffff; }
  .badge { fill: #2a78d6; } .b1 { fill: #2a78d6; } .b2 { fill: #eb6834; } .b3 { fill: #1f9d8a; } .b1 { fill: #2a78d6; } .b2 { fill: #eb6834; } .b3 { fill: #1f9d8a; } .b1 { fill: #2a78d6; } .b2 { fill: #eb6834; } .b3 { fill: #1f9d8a; }
  .flecha { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 6; animation: fluir 1s linear infinite; }
  .punta { fill: #2a78d6; }
  .f1 { stroke: #2a78d6; } .f2 { stroke: #eb6834; } .f3 { stroke: #1f9d8a; }
  .lt { font: 700 12px system-ui, 'Segoe UI', sans-serif; }
  .f1 { stroke: #2a78d6; } .f2 { stroke: #eb6834; } .f3 { stroke: #1f9d8a; }
  .lt { font: 700 12px system-ui, 'Segoe UI', sans-serif; }
  .f1 { stroke: #2a78d6; } .f2 { stroke: #eb6834; } .f3 { stroke: #1f9d8a; }
  .lt { font: 700 12px system-ui, 'Segoe UI', sans-serif; }
  .pulso { fill: none; stroke: #2a78d6; stroke-width: 3; opacity: 0; animation: pulso var(--ciclo, 8s) linear infinite; }
  .eje { stroke: #cfccc4; stroke-width: 1; }
  .rejilla { stroke: #e9e7e1; stroke-width: 1; }
  .tick { font: 400 11px system-ui, sans-serif; fill: #52514e; }
  .valor { font: 600 12px system-ui, sans-serif; fill: #0b0b0b; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1f9d8a; } .s3 { fill: #1f9d8a; } .s3 { fill: #1f9d8a; }
  .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; } .l3 { stroke: #1f9d8a; } .l3 { stroke: #1f9d8a; } .l3 { stroke: #1f9d8a; }
  .linea { fill: none; stroke-width: 2; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: trazar 2.2s ease-out forwards; }
  .barra { transform-box: fill-box; transform-origin: bottom; animation: crecer 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .barra-h { transform-box: fill-box; transform-origin: left; animation: crecer-h 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .aparece { opacity: 0; animation: aparecer .5s ease-out forwards; }
  .chip { stroke: #fcfcfb; stroke-width: 2; }
  .chip-t { font: 700 12px system-ui, sans-serif; fill: #ffffff; }
  @keyframes fluir { to { stroke-dashoffset: -12; } }
  @keyframes pulso { 0%, 9% { opacity: 1; } 12%, 100% { opacity: 0; } }
  @keyframes trazar { to { stroke-dashoffset: 0; } }
  @keyframes crecer { from { transform: scaleY(0); } }
  @keyframes crecer-h { from { transform: scaleX(0); } }
  @keyframes aparecer { to { opacity: 1; } }
  @media (prefers-color-scheme: dark) {
    .fondo { fill: #1a1a19; stroke: #383835; }
    .titulo, .caja-t, .valor { fill: #f0efec; }
    .sub, .caja-s, .tick { fill: #c3c2b7; }
    .caja { fill: #232322; stroke: #4a4a46; }
    .badge, .punta, .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #2bb7a3; } .s3 { fill: #2bb7a3; } .s3 { fill: #2bb7a3; }
    .flecha, .pulso, .l1, .f1 { stroke: #3987e5; } .l2, .f2 { stroke: #d95926; } .l3, .f3 { stroke: #2bb7a3; }
    .eje { stroke: #4a4a46; } .rejilla { stroke: #2c2c2a; }
    .chip { stroke: #1a1a19; }
    .b1 { fill: #3987e5; } .b2 { fill: #d95926; } .b3 { fill: #2bb7a3; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flecha, .pulso, .barra, .barra-h, .linea, .aparece { animation: none; }
    .linea { stroke-dashoffset: 0; } .aparece { opacity: 1; }
  }
  .pulso.f1 { stroke: #2a78d6; } .pulso.f2 { stroke: #eb6834; } .pulso.f3 { stroke: #1f9d8a; }  @media (prefers-color-scheme: dark) { .pulso.f1 { stroke: #3987e5; } .pulso.f2 { stroke: #d95926; } .pulso.f3 { stroke: #2bb7a3; } }  .pulso.f1 { stroke: #2a78d6; } .pulso.f2 { stroke: #eb6834; } .pulso.f3 { stroke: #1f9d8a; }  @media (prefers-color-scheme: dark) { .pulso.f1 { stroke: #3987e5; } .pulso.f2 { stroke: #d95926; } .pulso.f3 { stroke: #2bb7a3; } }</style>
<rect class="fondo" x="0.5" y="0.5" width="959" height="435" rx="14"/>
<text class="titulo" x="24" y="34">Canción cantada: reconocerla por su letra y, de respaldo, por su melodía</text>
<text class="sub" x="24" y="54">Cantar con la letra clara basta. Cantar en otro tono o a otro tempo no cambia el resultado.</text>
<text class="lt" x="24" y="84">UNA SOLA VEZ, POR CADA CANCIÓN DEL REPERTORIO</text>
<rect class="caja" x="24" y="100" width="176" height="84" rx="10"/>
<rect class="pulso f1" x="24" y="100" width="176" height="84" rx="10" style="--ciclo:12s; animation-delay:0.00s"/>
<circle class="badge b1" cx="44" cy="120" r="10"/><text class="num" x="44" y="124" text-anchor="middle">A</text>
<text class="caja-t" x="62" y="124">Canción original</text>
<text class="caja-s" x="38" y="146">mezcla con instrumentos</text>
<text class="caja-s" x="38" y="161">200 canciones peruanas</text>
<rect class="caja" x="236" y="100" width="176" height="84" rx="10"/>
<rect class="pulso f1" x="236" y="100" width="176" height="84" rx="10" style="--ciclo:12s; animation-delay:0.40s"/>
<circle class="badge b1" cx="256" cy="120" r="10"/><text class="num" x="256" y="124" text-anchor="middle">B</text>
<text class="caja-t" x="274" y="124">Demucs</text>
<text class="caja-s" x="250" y="146">red neuronal que aísla</text>
<text class="caja-s" x="250" y="161">la voz de la mezcla</text>
<rect class="caja" x="472" y="88" width="232" height="74" rx="10"/>
<rect class="pulso f2" x="472" y="88" width="232" height="74" rx="10" style="--ciclo:12s; animation-delay:0.80s"/>
<circle class="badge b2" cx="492" cy="108" r="10"/><text class="num" x="492" y="112" text-anchor="middle">C</text>
<text class="caja-t" x="510" y="112">Whisper → letra</text>
<text class="caja-s" x="486" y="134">frases con tiempo</text>
<text class="caja-s" x="486" y="149">tabla letras_acapella e índice</text>
<rect class="caja" x="472" y="172" width="232" height="74" rx="10"/>
<rect class="pulso f3" x="472" y="172" width="232" height="74" rx="10" style="--ciclo:12s; animation-delay:1.20s"/>
<circle class="badge b3" cx="492" cy="192" r="10"/><text class="num" x="492" y="196" text-anchor="middle">D</text>
<text class="caja-t" x="510" y="196">Melodía de referencia</text>
<text class="caja-s" x="486" y="218">nota dominante por fotograma</text>
<text class="caja-s" x="486" y="233">12 clases de nota</text>
<path class="flecha l1" d="M200 142 L236 142"/><path class="punta s1" d="M236 142 l-8 -4.5 v9 z"/>
<path class="flecha l2" d="M412 142 C442.0 142 442.0 125 472 125"/><path class="punta s2" d="M472 125 l-8 -4.5 v9 z"/>
<path class="flecha l3" d="M412 142 C442.0 142 442.0 209 472 209"/><path class="punta s3" d="M472 209 l-8 -4.5 v9 z"/>
<text class="lt" x="24" y="268">EN CADA CONSULTA</text>
<rect class="caja" x="24" y="280" width="150" height="96" rx="10"/>
<rect class="pulso f1" x="24" y="280" width="150" height="96" rx="10" style="--ciclo:12s; animation-delay:0.00s"/>
<circle class="badge b1" cx="44" cy="300" r="10"/><text class="num" x="44" y="304" text-anchor="middle">1</text>
<text class="caja-t" x="62" y="304">Tu voz</text>
<text class="caja-s" x="38" y="326">5 s a 2 min</text>
<text class="caja-s" x="38" y="341">a capela o con la pista</text>
<rect class="caja" x="206" y="280" width="164" height="96" rx="10"/>
<rect class="pulso f2" x="206" y="280" width="164" height="96" rx="10" style="--ciclo:12s; animation-delay:0.50s"/>
<circle class="badge b2" cx="226" cy="300" r="10"/><text class="num" x="226" y="304" text-anchor="middle">2</text>
<text class="caja-t" x="244" y="304">Whisper</text>
<text class="caja-s" x="220" y="326">transcribe tu voz</text>
<text class="caja-s" x="220" y="341">en frases con tiempo</text>
<rect class="caja" x="402" y="280" width="176" height="96" rx="10"/>
<rect class="pulso f2" x="402" y="280" width="176" height="96" rx="10" style="--ciclo:12s; animation-delay:1.00s"/>
<circle class="badge b2" cx="422" cy="300" r="10"/><text class="num" x="422" y="304" text-anchor="middle">3</text>
<text class="caja-t" x="440" y="304">BM25 sobre letras</text>
<text class="caja-s" x="416" y="326">votos por canción y tramos</text>
<text class="caja-s" x="416" y="341">≥ 2 frases y +30 % de ventaja</text>
<rect class="caja" x="610" y="280" width="150" height="96" rx="10"/>
<rect class="pulso f3" x="610" y="280" width="150" height="96" rx="10" style="--ciclo:12s; animation-delay:1.50s"/>
<circle class="badge b3" cx="630" cy="300" r="10"/><text class="num" x="630" y="304" text-anchor="middle">4</text>
<text class="caja-t" x="648" y="304">Melodía + DTW</text>
<text class="caja-s" x="624" y="326">solo si la letra falla</text>
<text class="caja-s" x="624" y="341">12 transposiciones</text>
<rect class="caja" x="792" y="280" width="144" height="96" rx="10"/>
<rect class="pulso f1" x="792" y="280" width="144" height="96" rx="10" style="--ciclo:12s; animation-delay:2.00s"/>
<circle class="badge b1" cx="812" cy="300" r="10"/><text class="num" x="812" y="304" text-anchor="middle">5</text>
<text class="caja-t" x="830" y="304">Resultado</text>
<text class="caja-s" x="806" y="326">canción, tramo, %</text>
<text class="caja-s" x="806" y="341">y texto reconocido</text>
<path class="flecha l2" d="M174 328 L206 328"/><path class="punta s2" d="M206 328 l-8 -4.5 v9 z"/>
<path class="flecha l2" d="M370 328 L402 328"/><path class="punta s2" d="M402 328 l-8 -4.5 v9 z"/>
<path class="flecha l3" d="M578 328 L610 328"/><path class="punta s3" d="M610 328 l-8 -4.5 v9 z"/>
<path class="flecha l1" d="M760 328 L792 328"/><path class="punta s1" d="M792 328 l-8 -4.5 v9 z"/>
<path class="flecha l2" d="M490 376 C490 402 864 402 864 376"/><path class="punta s2" d="M864 376 l-4.5 8 h9 z"/>
<text class="caja-s" x="677" y="420" text-anchor="middle">si la letra basta, la melodía no hace falta</text>
</svg>
