<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" width="960" role="img" aria-label="Aceleración frente a la búsqueda exacta con 100 000 vectores de audio: EXACTO 1, IVF 109, HNSW 178 veces.">
<title>Búsqueda de segmentos de audio: cuántas veces más rápido que recorrerlo todo</title>
<desc>Aceleración frente a la búsqueda exacta con 100 000 vectores de audio: EXACTO 1, IVF 109, HNSW 178 veces.</desc>
<style>
  :root { color-scheme: light dark; }
  .fondo { fill: #fcfcfb; stroke: #e4e2dc; }
  .titulo { font: 700 17px system-ui, 'Segoe UI', sans-serif; fill: #0b0b0b; }
  .sub { font: 400 12px system-ui, 'Segoe UI', sans-serif; fill: #52514e; }
  .caja { fill: #ffffff; stroke: #cfccc4; stroke-width: 1.5; }
  .caja-t { font: 600 13px system-ui, 'Segoe UI', sans-serif; fill: #0b0b0b; }
  .caja-s { font: 400 11px system-ui, 'Segoe UI', sans-serif; fill: #52514e; }
  .num { font: 700 11px system-ui, sans-serif; fill: #ffffff; }
  .badge { fill: #2a78d6; }
  .flecha { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 6 6; animation: fluir 1s linear infinite; }
  .punta { fill: #2a78d6; }
  .pulso { fill: none; stroke: #2a78d6; stroke-width: 3; opacity: 0; animation: pulso var(--ciclo, 8s) linear infinite; }
  .eje { stroke: #cfccc4; stroke-width: 1; }
  .rejilla { stroke: #e9e7e1; stroke-width: 1; }
  .tick { font: 400 11px system-ui, sans-serif; fill: #52514e; }
  .valor { font: 600 12px system-ui, sans-serif; fill: #0b0b0b; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; }
  .l1 { stroke: #2a78d6; } .l2 { stroke: #eb6834; }
  .linea { fill: none; stroke-width: 2; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: trazar 2.2s ease-out forwards; }
  .barra { transform-box: fill-box; transform-origin: bottom; animation: crecer 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .barra-h { transform-box: fill-box; transform-origin: left; animation: crecer-h 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .aparece { opacity: 0; animation: aparecer .5s ease-out forwards; }
  .chip { stroke: #fcfcfb; stroke-width: 2; }
  .chip-t { font: 700 12px system-ui, sans-serif; fill: #ffffff; }
  @keyframes fluir { to { stroke-dashoffset: -12; } }
  @keyframes pulso { 0%, 9% { opacity: 1; } 12%, 100% { opacity: 0; } }
  @keyframes trazar { to { stroke-dashoffset: 0; } }
  @keyframes crecer { from { transform: scaleY(0); } }
  @keyframes crecer-h { from { transform: scaleX(0); } }
  @keyframes aparecer { to { opacity: 1; } }
  @media (prefers-color-scheme: dark) {
    .fondo { fill: #1a1a19; stroke: #383835; }
    .titulo, .caja-t, .valor { fill: #f0efec; }
    .sub, .caja-s, .tick { fill: #c3c2b7; }
    .caja { fill: #232322; stroke: #4a4a46; }
    .badge, .punta, .s1 { fill: #3987e5; } .s2 { fill: #d95926; }
    .flecha, .pulso, .l1 { stroke: #3987e5; } .l2 { stroke: #d95926; }
    .eje { stroke: #4a4a46; } .rejilla { stroke: #2c2c2a; }
    .chip { stroke: #1a1a19; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flecha, .pulso, .barra, .barra-h, .linea, .aparece { animation: none; }
    .linea { stroke-dashoffset: 0; } .aparece { opacity: 1; }
  }
</style>
<rect class="fondo" x="0.5" y="0.5" width="959" height="311" rx="14"/>
<text class="titulo" x="24" y="34">Búsqueda de segmentos de audio: cuántas veces más rápido que recorrerlo todo</text>
<text class="sub" x="24" y="54">100 000 vectores, coseno, 256 dimensiones, k = 10. Fuente: bench/results/vector_compare.csv</text>
<line class="rejilla" x1="70" y1="250.0" x2="910" y2="250.0"/><text class="tick" x="62" y="254.0" text-anchor="end">0</text>
<line class="rejilla" x1="70" y1="210.0" x2="910" y2="210.0"/><text class="tick" x="62" y="214.0" text-anchor="end">25</text>
<line class="rejilla" x1="70" y1="170.0" x2="910" y2="170.0"/><text class="tick" x="62" y="174.0" text-anchor="end">50</text>
<line class="rejilla" x1="70" y1="130.0" x2="910" y2="130.0"/><text class="tick" x="62" y="134.0" text-anchor="end">75</text>
<line class="rejilla" x1="70" y1="90.0" x2="910" y2="90.0"/><text class="tick" x="62" y="94.0" text-anchor="end">100</text>
<line class="eje" x1="70" y1="250" x2="910" y2="250"/>
<text class="tick" x="30" y="72">veces</text>
<text class="tick" x="210.0" y="268" text-anchor="middle">EXACTO · 3.26 ms</text><text class="tick" x="210.0" y="284" text-anchor="middle">recall 1.00</text>
<rect class="barra s1" x="177.0" y="248.4" width="64.0" height="1.6" rx="4" style="animation-delay:0.00s"><title>aceleración · EXACTO · 3.26 ms: 1</title></rect><text class="valor aparece" x="209.0" y="242.4" text-anchor="middle" style="animation-delay:0.90s">1</text>
<text class="tick" x="490.0" y="268" text-anchor="middle">IVF · 0.037 ms</text><text class="tick" x="490.0" y="284" text-anchor="middle">recall 0.95</text>
<rect class="barra s1" x="457.0" y="108.9" width="64.0" height="141.1" rx="4" style="animation-delay:0.15s"><title>aceleración · IVF · 0.037 ms: 88</title></rect><text class="valor aparece" x="489.0" y="102.9" text-anchor="middle" style="animation-delay:1.05s">88</text>
<text class="tick" x="770.0" y="268" text-anchor="middle">HNSW · 0.047 ms</text><text class="tick" x="770.0" y="284" text-anchor="middle">recall 0.98</text>
<rect class="barra s1" x="737.0" y="139.4" width="64.0" height="110.6" rx="4" style="animation-delay:0.30s"><title>aceleración · HNSW · 0.047 ms: 69</title></rect><text class="valor aparece" x="769.0" y="133.4" text-anchor="middle" style="animation-delay:1.20s">69</text>
</svg>
